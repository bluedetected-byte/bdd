[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/auth/*"
  to = "/.netlify/functions/api/auth/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/download/file"
  to = "/.netlify/functions/api/download/file"
  status = 200

[[redirects]]
  from = "/download"
  to = "/.netlify/functions/api/download"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/.netlify/functions/api/privacy"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/.netlify/functions/api/terms"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/.netlify/functions/api/dashboard"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
