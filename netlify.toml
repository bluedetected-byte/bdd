[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,TRUST_PROXY,RETENTION_DAYS,MAX_ACTIVE_CODES,GLOBAL_RATE_LIMIT_PER_MINUTE,API_RATE_LIMIT_PER_MINUTE,SELLER_RATE_LIMIT_PER_10_MINUTES,MAX_PENDING_WRITES,BASE_URL,DOWNLOAD_URL"
[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/auth/*"
  to = "/.netlify/functions/api/auth/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/download/file"
  to = "/.netlify/functions/api/download/file"
  status = 200

[[redirects]]
  from = "/download"
  to = "/.netlify/functions/api/download"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/.netlify/functions/api/privacy"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/.netlify/functions/api/terms"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/.netlify/functions/api/dashboard"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
